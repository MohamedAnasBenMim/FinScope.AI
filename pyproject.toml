[tool.pytest.ini_options]
pythonpath = ["backend", "."]
testpaths = ["tests"]
markers = ["integration: requires local models or OCR", "live: requires a running Docker stack"]

[tool.ruff]
target-version = "py312"
line-length = 110
exclude = ["venv", "backend/venv", "backend/create_sample_pdf.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
